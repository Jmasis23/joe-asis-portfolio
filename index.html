  <style id="portfolio-refinements">
    .core-skills { margin-top: 2rem; }
    .core-skills h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 14px; }
    .core-skills ul { display: flex; flex-wrap: wrap; gap: 8px; }
    .core-skills li { border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.04); border-radius: 999px; padding: 8px 12px; font-size: 12px; line-height: 1.4; color: rgba(255,255,255,.85); }

    #showcase .grid > div { min-width: 0; }
    #portfolio-nav { background: rgba(10,10,10,.82); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.08); }
    button:focus-visible, a:focus-visible { outline: 2px solid #D6FF5C; outline-offset: 4px; }
    @media (max-width: 1199px) {
      #portfolio-nav .portfolio-desktop-menu, #portfolio-nav .portfolio-desktop-booking { display: none; }
      #portfolio-nav .portfolio-menu-toggle, #portfolio-mobile-menu { display: flex; }
